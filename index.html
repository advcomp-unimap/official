<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sistem Log in UniMAP</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-image: url("C:/Users/Admin/Downloads/blue-green-wave-with-grid-lines-lines.jpg.jpeg");
            background-size: cover; /* Ensures the background covers the entire screen */
            background-repeat: no-repeat; /* Prevents the background from repeating */
            background-attachment: fixed; /* Makes the background fixed during scrolling */
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: white;
        }
        .container-login {
            display: flex;
            flex-direction: column;
            width: 450px;
            padding: 20px;
            border: 1px solid skyblue;
            border-radius: 10px;
            margin: 10px;
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.3);
            z-index: 1;
        }
        .input-group {
            display: flex;
            justify-content: space-between;
        }
        input {
            flex: 1;
            margin: 10px 0;
            height: 35px;
            padding: 7px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .header h1 {
            font-size: 28px; /* Increased font size */
            margin-bottom: 5px;
            font-family: 'Roboto', Arial, sans-serif; /* Modern font */
            color: black; /* White font color */
            text-align: center; /* Center alignment */
            font-weight: bold; /* Bold font weight */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); /* Subtle text shadow */
        }

        button {
            height: 45px;
            width: 100%;
            background-color: skyblue;
            border: none;
            border-radius: 5px;
            color: #333;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #333;
            color: skyblue;
        }
        .logo {
            margin-bottom: 5px;
            text-align: center;
        }
        .logo img {
            width: 300px;
            height: auto;
        }
        a {
            color: white;
            text-decoration: underline;
            margin-top: 15px;
            display: inline-block;
        }
        a:hover {
            text-decoration: underline;
        }
        @media (max-width: 700px) {
            .container-login {
                width: 85%;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container-login">
        <div class="logo">
            <img src="https://raw.githubusercontent.com/sand-cat/sandcatgo/refs/heads/main/advacomp%20logo.png" alt="UniMAP Logo">
        </div>
        <div class="header">
            <h1>Login System</h1>
        </div>
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="loginUsername" placeholder="Username" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
            </div>
            <button type="submit">Log In</button>
        </form>
    </div>

    <!-- Include Firebase SDK -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js';
        import { getAnalytics } from 'https://www.gstatic.com/firebasejs/9.22.2/firebase-analytics.js';
        import { getDatabase, ref, get, set, child } from 'https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js';

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAjg1SXswQB4n_haVEsi1PnFEsafFzmSSc",
            databaseURL: "https://advcomp-aef77-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "advcomp-aef77",
            appId: "1:325894626351:web:258147e110e95c9daabada"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const database = getDatabase(app);

        const userId = localStorage.getItem('userId');

        // Function to verify username and password
        function verifyUser(username, password) {
            const dbRef = ref(database);
            get(child(dbRef, 'users')).then((snapshot) => {
                if (snapshot.exists()) {
                    let authenticated = false;
                    let userId = null;
                    let usernameExists = false;
                    snapshot.forEach((userSnapshot) => {
                        const userData = userSnapshot.val();
                        if (userData.username === username) {
                            usernameExists = true;
                            if (userData.password === password) {
                                authenticated = true;
                                userId = userSnapshot.key;

                                localStorage.setItem('userId', userId);
                                localStorage.setItem('username', username);
                                localStorage.setItem('isLoggedIn', 'true');

                                logDeviceAccess(userId); 

                                window.location.href = "https://advcomp-unimap.github.io/admin/html";

                            }
                        }
                    });
                    if (!authenticated) {
                        if (usernameExists) {
                            alert('Incorrect password.');
                        } else {
                            alert('Invalid username or password.');
                        }
                    }
                } else {
                    console.log("No data available");
                }
            }).catch((error) => {
                console.error('Error reading user data:', error);
            });
        }

                function logDeviceAccess(userId) {
            const deviceName = navigator.userAgent;
            const platform = navigator.platform;

            const now = new Date();
            const formattedTime = now.toLocaleString(); // date + time

            const deviceId = "device_" + Date.now(); // unique ID

            const deviceRef = ref(database, `users/${userId}/devices/${deviceId}`);

            set(deviceRef, {
                deviceName: platform,
                userAgent: deviceName,
                lastLogin: formattedTime
            });
        }

        // Event listener for login form submission
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            verifyUser(username, password);
        });
    </script>
</body>
</html>
